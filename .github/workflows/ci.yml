name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit-тесты (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Права на gradlew
        run: chmod +x ./gradlew

      - name: ./gradlew test
        run: ./gradlew test --console=plain --stacktrace
